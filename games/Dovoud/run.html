<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沃德快跑</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0a;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 100vh;
            max-height: 500px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            border: 3px solid #e94560;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
        }
        
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #score {
            position: absolute;
            top: 20px;
            right: 70px;
            color: #e94560;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            letter-spacing: 2px;
        }
        
        #settingsBtn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            background: transparent;
            border: 2px solid #e94560;
            color: #e94560;
            font-size: 20px;
            cursor: pointer;
            pointer-events: auto;
            clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #settingsBtn:hover {
            background: #e94560;
            color: #fff;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
        }
        
        #health {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 32px;
            letter-spacing: 5px;
            filter: drop-shadow(2px 2px 0px #000);
            transition: transform 0.1s;
        }
        
        #health.damage {
            animation: shake 0.3s;
        }
        
        #health.heal {
            animation: pulse-green 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        @keyframes pulse-green {
            0%, 100% { transform: scale(1); filter: drop-shadow(2px 2px 0px #000); }
            50% { transform: scale(1.2); filter: drop-shadow(0 0 10px #00ff00); }
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            pointer-events: auto;
        }
        
        #gameOver h1 {
            color: #e94560;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0px #000;
            letter-spacing: 4px;
            animation: glitch 1s infinite;
        }
        
        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-2px, -2px); }
            80% { transform: translate(2px, 2px); }
        }
        
        #finalScore {
            color: #fff;
            font-size: 24px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0px #000;
        }
        
        #restartBtn {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
            transition: all 0.2s;
        }
        
        #restartBtn:hover {
            background: #ff6b6b;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.6);
        }
        
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }
        
        #startScreen h1 {
            color: #e94560;
            font-size: 56px;
            margin-bottom: 10px;
            text-shadow: 4px 4px 0px #000;
            letter-spacing: 6px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        #startScreen p {
            color: #888;
            font-size: 16px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        #startScreen .controls {
            color: #666;
            font-size: 14px;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }
        
        #startBtn {
            background: transparent;
            color: #e94560;
            border: 3px solid #e94560;
            padding: 18px 50px;
            font-size: 24px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 4px;
            clip-path: polygon(0% 0%, 100% 0%, 95% 100%, 5% 100%);
            transition: all 0.3s;
        }
        
        #startBtn:hover {
            background: #e94560;
            color: #fff;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.5);
        }
        
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 0, 0, 0.1) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
        }
        
        #damageOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(255, 0, 0, 0.3) 100%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s;
        }
        
        #damageOverlay.show {
            opacity: 1;
        }
        
        #healOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(0, 255, 100, 0.2) 100%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        #healOverlay.show {
            opacity: 1;
        }
        
        /* 设置面板 */
        #settingsPanel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 20;
        }
        
        #settingsPanel.show {
            display: flex;
        }
        
        #settingsPanel h2 {
            color: #e94560;
            font-size: 36px;
            margin-bottom: 30px;
            text-shadow: 3px 3px 0px #000;
            letter-spacing: 4px;
        }
        
        .settingItem {
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .settingLabel {
            color: #fff;
            font-size: 18px;
            width: 120px;
            text-align: right;
        }
        
        .toggleBtn {
            background: transparent;
            border: 2px solid #e94560;
            color: #e94560;
            padding: 8px 20px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            cursor: pointer;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
            transition: all 0.2s;
            min-width: 80px;
        }
        
        .toggleBtn.active {
            background: #e94560;
            color: #fff;
        }
        
        .toggleBtn:hover {
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.4);
        }
        
        #imageUpload {
            display: none;
        }
        
        .uploadLabel {
            background: transparent;
            border: 2px solid #e94560;
            color: #e94560;
            padding: 8px 20px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            cursor: pointer;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
            transition: all 0.2s;
            display: inline-block;
        }
        
        .uploadLabel:hover {
            background: #e94560;
            color: #fff;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.4);
        }
        
        #fileName {
            color: #888;
            font-size: 14px;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        #closeSettings {
            margin-top: 40px;
            background: #e94560;
            color: #fff;
            border: none;
            padding: 12px 40px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
            transition: all 0.2s;
        }
        
        #closeSettings:hover {
            background: #ff6b6b;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.6);
        }
        
        #pauseText {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e94560;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 3px 3px 0px #000;
            letter-spacing: 8px;
            display: none;
            pointer-events: none;
            z-index: 15;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div class="scanline"></div>
        <div id="damageOverlay"></div>
        <div id="healOverlay"></div>
        <div id="pauseText">PAUSED</div>
        
        <div id="ui">
            <div id="health">❤️❤️❤️❤️❤️</div>
            <div id="score">0</div>
            <button id="settingsBtn">⚙</button>
            
            <div id="startScreen">
                <h1>沃德快跑</h1>
                <p>按空格键或点击屏幕跳跃</p>
                <p class="controls">跑快快</p>
                <button id="startBtn">开始游戏</button>
            </div>
            
            <div id="gameOver">
                <h1>游戏结束</h1>
                <div id="finalScore">得分: 0</div>
                <button id="restartBtn">重新开始</button>
            </div>
        </div>
        
        <div id="settingsPanel">
            <h2>设置</h2>
            
            <div class="settingItem">
                <span class="settingLabel">游戏音效</span>
                <button id="soundToggle" class="toggleBtn active">开启</button>
            </div>
            
            <div class="settingItem">
                <span class="settingLabel">自定义角色</span>
                <label for="imageUpload" class="uploadLabel">选择图片</label>
                <input type="file" id="imageUpload" accept="image/*">
                <span id="fileName">默认</span>
            </div>
            
            <button id="closeSettings">返回游戏</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const healthElement = document.getElementById('health');
        const damageOverlay = document.getElementById('damageOverlay');
        const healOverlay = document.getElementById('healOverlay');
        const gameOverScreen = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const closeSettings = document.getElementById('closeSettings');
        const soundToggle = document.getElementById('soundToggle');
        const imageUpload = document.getElementById('imageUpload');
        const fileName = document.getElementById('fileName');
        const pauseText = document.getElementById('pauseText');
        
        // 设置状态
        let soundEnabled = true;
        let customImage = null;
        let isPaused = false;
        let animationId = null;
        
        // 设置画布大小
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // 游戏状态
        let gameRunning = false;
        let score = 0;
        let gameSpeed = 300;
        let frame = 0;
        let maxHealth = 5;
        let currentHealth = 5;
        let invincible = false;
        let invincibleTimer = 0;
        
        // 时间控制变量
        let lastTime = 0;
        const targetFPS = 60;
        
        // 加载沃德图片
        const dovoudImage = new Image();
        dovoudImage.src = './dovoud.png';
        // Dovoud is Dove Cloud.
        let dovoudLoaded = false;
        dovoudImage.onload = () => {
            dovoudLoaded = true;
        };
        
        // 音效系统
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (!soundEnabled) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            if (type === 'jump') {
                oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(600, audioContext.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } else if (type === 'doubleJump') {
                oscillator.frequency.setValueAtTime(500, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.15);
            } else if (type === 'damage') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            } else if (type === 'heal') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(800, audioContext.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            }
        }
        
        // 咪咪咪
        const player = {
            x: 100,
            y: 0,
            width: 60,
            height: 60,
            velocityY: 0,
            jumping: false,
            grounded: false,
            jumpPower: -800,
            gravity: 2000,
            maxJumps: 2,
            remainingJumps: 2,
            
            update(dt) {
                this.velocityY += this.gravity * dt;
                this.y += this.velocityY * dt;
                
                const groundY = canvas.height - 100;
                if (this.y + this.height >= groundY) {
                    this.y = groundY - this.height;
                    this.velocityY = 0;
                    this.grounded = true;
                    this.jumping = false;
                    this.remainingJumps = this.maxJumps;
                } else {
                    this.grounded = false;
                }
            },
            
            jump() {
                if (this.remainingJumps > 0) {
                    this.velocityY = this.jumpPower;
                    this.jumping = true;
                    this.remainingJumps--;
                    
                    playSound(this.remainingJumps === 0 ? 'doubleJump' : 'jump');
                    createParticles(
                        this.x + this.width/2, 
                        this.y + this.height, 
                        this.remainingJumps === 0 ? 15 : 10,
                        this.remainingJumps === 0 ? '#00ffff' : '#ffffff'
                    );
                }
            },
            
            draw() {
                ctx.save();
                
                if (invincible && Math.floor(frame / 4) % 2 === 0) {
                    ctx.globalAlpha = 0.3;
                }
                
                if (this.jumping) {
                    ctx.translate(this.x + this.width/2, this.y + this.height/2);
                    if (this.remainingJumps === 0 && !this.grounded) {
                        ctx.rotate(0.2);
                    } else {
                        ctx.rotate(-0.1);
                    }
                    ctx.translate(-(this.x + this.width/2), -(this.y + this.height/2));
                }
                
                const img = customImage || catImage;
                if (img.complete && img.naturalWidth !== 0) {
                    ctx.drawImage(img, this.x, this.y, this.width, this.height);
                } else {
                    ctx.fillStyle = '#e94560';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                }
                
                ctx.restore();
                
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(this.x + 10, canvas.height - 95, this.width - 20, 10);
            }
        };
        
        // 障碍物类
        class Obstacle {
            constructor() {
                this.width = 40 + Math.random() * 30;
                this.height = 50 + Math.random() * 60;
                this.x = canvas.width;
                this.y = canvas.height - 100 - this.height;
                this.passed = false;
                this.type = Math.random() > 0.5 ? 'spike' : 'block';
                this.hit = false;
            }
            
            update(dt) {
                this.x -= gameSpeed * dt;
            }
            
            draw() {
                ctx.save();
                
                if (this.type === 'spike') {
                    ctx.fillStyle = '#ff2e63';
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y + this.height);
                    ctx.lineTo(this.x + this.width/2, this.y);
                    ctx.lineTo(this.x + this.width, this.y + this.height);
                    ctx.closePath();
                    ctx.fill();
                    
                    ctx.strokeStyle = '#ff6b6b';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else {
                    ctx.fillStyle = '#533483';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    
                    ctx.strokeStyle = '#e94560';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(this.x, this.y, this.width, this.height);
                    
                    ctx.fillStyle = '#e94560';
                    ctx.fillRect(this.x + 10, this.y + 10, this.width - 20, 5);
                    ctx.fillRect(this.x + 10, this.y + 25, this.width - 20, 5);
                    
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
                    ctx.fillRect(this.x, this.y, 5, this.height);
                }
                
                ctx.restore();
            }
        }
        
        // 红心道具类
        class Heart {
            constructor() {
                this.size = 40;
                this.x = canvas.width;
                // 随机高度：地面到跳跃最高点之间
                const minY = canvas.height - 150;
                const maxY = canvas.height - 250;
                this.y = minY + Math.random() * (maxY - minY);
                this.collected = false;
                this.bobOffset = Math.random() * Math.PI * 2; // 浮动动画偏移
            }
            
            update(dt) {
                this.x -= gameSpeed * dt;
            }
            
            draw(time) {
                if (this.collected) return;
                
                ctx.save();
                
                // 上下浮动效果
                const bobY = Math.sin(time * 3 + this.bobOffset) * 5;
                
                // 发光效果
                ctx.shadowColor = '#ff0066';
                ctx.shadowBlur = 20;
                
                // 绘制红心
                ctx.fillStyle = '#ff0066';
                ctx.translate(this.x + this.size/2, this.y + this.size/2 + bobY);
                
                // 心形路径
                ctx.beginPath();
                const s = this.size / 2;
                ctx.moveTo(0, s * 0.3);
                ctx.bezierCurveTo(-s * 0.5, -s * 0.3, -s, s * 0.1, 0, s);
                ctx.bezierCurveTo(s, s * 0.1, s * 0.5, -s * 0.3, 0, s * 0.3);
                ctx.closePath();
                ctx.fill();
                
                // 高光
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.beginPath();
                ctx.arc(-s * 0.2, -s * 0.1, s * 0.15, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        // 粒子系统
        let particles = [];
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 300;
                this.vy = (Math.random() - 0.5) * 300;
                this.life = 1;
                this.color = color || `hsl(${Math.random() * 60 + 330}, 100%, 60%)`;
                this.size = Math.random() * 4 + 2;
            }
            
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.vy += 500 * dt;
                this.life -= dt * 1.2;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }
        
        function createParticles(x, y, count, color) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }
        
        // 背景装饰
        const stars = [];
        for (let i = 0; i < 50; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * (canvas.height - 150),
                size: Math.random() * 2,
                speed: Math.random() * 30 + 10
            });
        }
        
        let obstacles = [];
        let hearts = []; // 红心数组
        let obstacleTimer = 0;
        let heartTimer = 0; // 红心生成计时器
        const obstacleSpawnInterval = 1.0;
        const heartSpawnInterval = 8.0; // 每8秒生成一个红心
        
        function updateHealth() {
            let hearts = '';
            for (let i = 0; i < maxHealth; i++) {
                hearts += i < currentHealth ? '❤️' : '🖤';
            }
            healthElement.textContent = hearts;
        }
        
        function takeDamage() {
            if (invincible) return;
            
            currentHealth--;
            updateHealth();
            playSound('damage');
            
            healthElement.classList.add('damage');
            damageOverlay.classList.add('show');
            setTimeout(() => {
                healthElement.classList.remove('damage');
                damageOverlay.classList.remove('show');
            }, 300);
            
            createParticles(player.x + player.width/2, player.y + player.height/2, 20, '#ff0000');
            
            invincible = true;
            invincibleTimer = 2.0;
            
            if (currentHealth <= 0) {
                gameOver();
            }
        }
        
        function heal() {
            if (currentHealth >= maxHealth) return; // 满血不加
            
            currentHealth++;
            updateHealth();
            playSound('heal');
            
            // 视觉反馈
            healthElement.classList.add('heal');
            healOverlay.classList.add('show');
            setTimeout(() => {
                healthElement.classList.remove('heal');
                healOverlay.classList.remove('show');
            }, 500);
            
            // 绿色粒子效果
            createParticles(player.x + player.width/2, player.y + player.height/2, 25, '#00ff66');
        }
        
        function pointInTriangle(px, py, x1, y1, x2, y2, x3, y3) {
            const area = 0.5 * (-y2 * x3 + y1 * (-x2 + x3) + x1 * (y2 - y3) + x2 * y3);
            const s = 1 / (2 * area) * (y1 * x3 - y1 * x1 + py * (x1 - x3) + px * (y3 - y1));
            const t = 1 / (2 * area) * (y1 * x2 - y1 * x1 + py * (x1 - x2) + px * (y2 - y1));
            return s > 0 && t > 0 && (1 - s - t) > 0;
        }
        
        function checkCollision(player, obstacle) {
            if (obstacle.hit) return false;
            
            if (obstacle.type === 'block') {
                if (player.x < obstacle.x + obstacle.width &&
                    player.x + player.width > obstacle.x &&
                    player.y < obstacle.y + obstacle.height &&
                    player.y + player.height > obstacle.y) {
                    
                    const overlapLeft = (player.x + player.width) - obstacle.x;
                    const overlapRight = (obstacle.x + obstacle.width) - player.x;
                    const overlapTop = (player.y + player.height) - obstacle.y;
                    const overlapBottom = (obstacle.y + obstacle.height) - player.y;
                    
                    const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
                    
                    if (minOverlap === overlapTop && player.velocityY >= 0) {
                        player.y = obstacle.y - player.height;
                        player.velocityY = 0;
                        player.grounded = true;
                        player.jumping = false;
                        player.remainingJumps = player.maxJumps;
                        return false;
                    }
                    
                    if (minOverlap === overlapLeft) {
                        obstacle.hit = true;
                        takeDamage();
                        return true;
                    }
                    
                    if (minOverlap === overlapRight) {
                        player.x = obstacle.x + obstacle.width;
                    } else if (minOverlap === overlapBottom) {
                        player.y = obstacle.y + obstacle.height;
                        player.velocityY = 0;
                    }
                    return false;
                }
            } else {
                const x1 = obstacle.x;
                const y1 = obstacle.y + obstacle.height;
                const x2 = obstacle.x + obstacle.width / 2;
                const y2 = obstacle.y;
                const x3 = obstacle.x + obstacle.width;
                const y3 = obstacle.y + obstacle.height;
                
                const corners = [
                    {x: player.x, y: player.y},
                    {x: player.x + player.width, y: player.y},
                    {x: player.x, y: player.y + player.height},
                    {x: player.x + player.width, y: player.y + player.height}
                ];
                
                const spikePoints = [
                    {x: x1, y: y1},
                    {x: x2, y: y2},
                    {x: x3, y: y3}
                ];
                
                let collision = false;
                
                for (let corner of corners) {
                    if (pointInTriangle(corner.x, corner.y, x1, y1, x2, y2, x3, y3)) {
                        collision = true;
                        break;
                    }
                }
                
                if (!collision) {
                    for (let pt of spikePoints) {
                        if (pt.x >= player.x && pt.x <= player.x + player.width &&
                            pt.y >= player.y && pt.y <= player.y + player.height) {
                            collision = true;
                            break;
                        }
                    }
                }
                
                if (!collision) {
                    const spikeBounds = {
                        x: obstacle.x,
                        y: obstacle.y,
                        width: obstacle.width,
                        height: obstacle.height
                    };
                    if (!(player.x > spikeBounds.x + spikeBounds.width ||
                          player.x + player.width < spikeBounds.x ||
                          player.y > spikeBounds.y + spikeBounds.height ||
                          player.y + player.height < spikeBounds.y)) {
                        collision = true;
                    }
                }
                
                if (collision) {
                    obstacle.hit = true;
                    takeDamage();
                    return true;
                }
            }
            
            return false;
        }
        
        // 检测玩家与红心的碰撞
        function checkHeartCollision(player, heart) {
            if (heart.collected) return false;
            
            // 简单的矩形碰撞检测
            const heartHitbox = {
                x: heart.x + 5,
                y: heart.y + 5,
                width: heart.size - 10,
                height: heart.size - 10
            };
            
            if (player.x < heartHitbox.x + heartHitbox.width &&
                player.x + player.width > heartHitbox.x &&
                player.y < heartHitbox.y + heartHitbox.height &&
                player.y + player.height > heartHitbox.y) {
                
                heart.collected = true;
                heal();
                return true;
            }
            return false;
        }
        
        function drawBackground(dt) {
            ctx.fillStyle = '#fff';
            stars.forEach(star => {
                ctx.globalAlpha = Math.random() * 0.5 + 0.3;
                ctx.fillRect(star.x, star.y, star.size, star.size);
                star.x -= star.speed * dt;
                if (star.x < 0) star.x = canvas.width;
            });
            ctx.globalAlpha = 1;
            
            ctx.fillStyle = '#0f0f23';
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
            
            ctx.strokeStyle = '#e94560';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 100);
            ctx.lineTo(canvas.width, canvas.height - 100);
            ctx.stroke();
            
            ctx.strokeStyle = 'rgba(233, 69, 96, 0.2)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                const offset = (frame * 2) % 40;
                ctx.beginPath();
                ctx.moveTo(i - offset, canvas.height - 100);
                ctx.lineTo(i - offset - 20, canvas.height);
                ctx.stroke();
            }
        }
        
        function gameLoop(currentTime) {
            if (!gameRunning || isPaused) {
                animationId = requestAnimationFrame(gameLoop);
                return;
            }
            
            if (!lastTime) lastTime = currentTime;
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            const dt = Math.min(deltaTime / 1000, 0.1);
            const time = currentTime / 1000; // 用于动画
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (invincible) {
                invincibleTimer -= dt;
                if (invincibleTimer <= 0) {
                    invincible = false;
                }
            }
            
            drawBackground(dt);
            
            player.update(dt);
            
            // 生成障碍物
            obstacleTimer += dt;
            if (obstacleTimer > obstacleSpawnInterval + Math.random() * 0.5) {
                obstacles.push(new Obstacle());
                obstacleTimer = 0;
            }
            
            // 生成红心
            heartTimer += dt;
            if (heartTimer > heartSpawnInterval) {
                hearts.push(new Heart());
                heartTimer = 0;
            }
            
            // 更新障碍物
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update(dt);
            }
            
            // 更新红心
            for (let i = hearts.length - 1; i >= 0; i--) {
                hearts[i].update(dt);
            }
            
            // 检测障碍物碰撞
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                checkCollision(player, obs);
                
                if (!obs.passed && obs.x + obs.width < player.x) {
                    obs.passed = true;
                    score++;
                    scoreElement.textContent = score;
                    
                    if (score % 10 === 0) {
                        gameSpeed += 30;
                    }
                }
                
                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                }
            }
            
            // 检测红心碰撞
            for (let i = hearts.length - 1; i >= 0; i--) {
                checkHeartCollision(player, hearts[i]);
                
                // 移除屏幕外或已收集的红心
                if (hearts[i].x + hearts[i].size < 0 || hearts[i].collected) {
                    hearts.splice(i, 1);
                }
            }
            
            player.draw();
            
            obstacles.forEach(obs => obs.draw());
            
            // 绘制红心（在障碍物之后，玩家之前）
            hearts.forEach(heart => heart.draw(time));
            
            // 更新和绘制粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update(dt);
                p.draw();
                if (p.life <= 0) particles.splice(i, 1);
            }
            
            frame++;
            animationId = requestAnimationFrame(gameLoop);
        }
        
        function gameOver() {
            gameRunning = false;
            finalScoreElement.textContent = `得分: ${score}`;
            gameOverScreen.style.display = 'block';
            createParticles(player.x + player.width/2, player.y + player.height/2, 50, '#ff0000');
        }
        
        function resetGame() {
            score = 0;
            gameSpeed = 300;
            frame = 0;
            currentHealth = maxHealth;
            invincible = false;
            invincibleTimer = 0;
            obstacles = [];
            hearts = []; // 清空红心
            particles = [];
            obstacleTimer = 0;
            heartTimer = 0; // 重置红心计时器
            player.y = 0;
            player.velocityY = 0;
            player.grounded = false;
            player.remainingJumps = player.maxJumps;
            lastTime = 0;
            scoreElement.textContent = '0';
            updateHealth();
            gameOverScreen.style.display = 'none';
            startScreen.style.display = 'none';
            gameRunning = true;
            isPaused = false;
            pauseText.style.display = 'none';
            animationId = requestAnimationFrame(gameLoop);
        }
        
        function openSettings() {
            if (!gameRunning) return;
            isPaused = true;
            pauseText.style.display = 'block';
            settingsPanel.classList.add('show');
        }
        
        function closeSettingsFunc() {
            settingsPanel.classList.remove('show');
            pauseText.style.display = 'none';
            isPaused = false;
            lastTime = 0;
        }
        
        settingsBtn.addEventListener('click', openSettings);
        closeSettings.addEventListener('click', closeSettingsFunc);
        
        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundToggle.textContent = soundEnabled ? '开启' : '关闭';
            soundToggle.classList.toggle('active', soundEnabled);
        });
        
        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        customImage = img;
                        fileName.textContent = file.name;
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
        
        function handleJump(e) {
            if (e.type === 'keydown' && e.code !== 'Space') return;
            if (e.type === 'keydown') e.preventDefault();
            
            if (gameRunning && !isPaused) {
                player.jump();
            }
        }
        
        window.addEventListener('keydown', handleJump);
        canvas.addEventListener('click', () => {
            if (gameRunning && !isPaused) player.jump();
        });
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameRunning && !isPaused) player.jump();
        });
        
        startBtn.addEventListener('click', resetGame);
        restartBtn.addEventListener('click', resetGame);
        
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && gameRunning) {
                e.preventDefault();
            }
        });
        
        settingsPanel.addEventListener('click', (e) => {
            if (e.target === settingsPanel) {
                closeSettingsFunc();
            }
        });
    </script>
</body>
</html>
