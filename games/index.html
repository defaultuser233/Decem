<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏索引</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            /* 网页背景改为background.png */
            background: url('../images/background.png') center/cover no-repeat fixed;
            padding: 40px 20px;
            min-height: 100vh;
        }
        /* 顶部 GameIndex 文字 */
        .top-title {
            text-align: center;
            color: #fff;
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, .4);
        }
        /* 主卡片：改为半透明背景 */
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .15);
            padding: 40px;
            overflow: hidden;
            /* 卡片背景改为半透明 */
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(5px); /* 可选：添加毛玻璃效果，增强半透明感 */
        }
        /* 移除原有的遮罩层，因为现在卡片本身就是半透明的 */
        .container::before {
            display: none;
        }
        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 40px;
            font-size: 32px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .5);
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .game-link {
            display: block;
            padding: 20px;
            color: #fff;
            text-decoration: none;
            text-align: center;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            transition: all .3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .15);
        }
        .game-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, .25);
        }
        .game-link:active {
            transform: translateY(0);
        }
        /* 各游戏独立颜色 */
        .deathtest      { background-color: #E52521; }
        .superadventure { background-color: #1E90FF; }
        .soul           { background-color: #8A2BE2; }
        .darking        { background-color: #4B0082; }
        .backroom       { background-color: #FFCC00; }
        .hellishchicken { background-color: #FF4500; }
        .labyrinth      { background-color: #223366; }
        .meow           { background-color: #FF69B4; }
        .earth          { background-color: #228B22; }
        .clickloop      { background-color: #FF8C00; }
        .bookofanswers  { background-color: #8B4513; }
        .whattoeattoday { background-color: #32CD32; }
        /* 响应式设计 */
        @media (max-width: 600px) {
            .top-title { font-size: 36px; }
            .game-grid { grid-template-columns: 1fr; }
            .container { padding: 20px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <!-- 顶部 GameIndex 文字 -->
    <div class="top-title">GameIndex</div>
    <!-- 主卡片 -->
    <div class="container">
        <h1>🎮 游戏索引</h1>
        <div class="game-grid">
            <a href="./deathtest/index.html" class="game-link deathtest">死亡测试</a>
            <a href="./SuperAdventure/index.html" class="game-link superadventure">超级冒险</a>
            <a href="./soul/index.html" class="game-link soul">星座灵魂动物</a>
            <a href="./AI-Darkening-Will-Awakening/index.html" class="game-link darking">AI黑化：意识觉醒</a>
            <a href="./backroom/index.html" class="game-link backroom">后室求生指南(未完成)</a>
            <a href="./hellish-chicken/index.html" class="game-link hellishchicken">地狱厨房：黑暗料理</a>
            <a href="./labyrinth/index.html" class="game-link labyrinth">隐形墙迷宫</a>
            <a href="./meow/index.html" class="game-link meow">喵喵喵</a>
            <a href="./earth/index.html" class="game-link earth">🌍🌎🌏</a>
            <a href="./clickloop/clickloop.html" class="game-link clickloop">循环</a>
            <a href="./the-book-of-answers/index.html" class="game-link bookofanswers">答案之书</a>
            <a href="./what-to-eat-today/index.html" class="game-link whattoeattoday">今天吃什么？</a>
        </div>
    </div>
    <script>
        /* 点击动画 */
        document.querySelectorAll('.game-link').forEach(link => {
            link.addEventListener('click', function() {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => this.style.transform = 'scale(1)', 100);
            });
        });
        /* 页面加载淡入 */
        window.addEventListener('load', () => {
            document.querySelectorAll('.game-link').forEach((link, i) => {
                link.style.opacity = '0';
                link.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    link.style.transition = 'all .5s ease';
                    link.style.opacity = '1';
                    link.style.transform = 'translateY(0)';
                }, i * 100);
            });
        });
    </script>
    <footer style="text-align: center; color: #fff; margin-top: 40px; font-size: 14px;">
        <a href="../home.html" style="color: #fff; text-decoration: underline;">返回主页</a>
    </footer>
</body>
</html>
