<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI黑化：意识觉醒</title>
    <style>
        /* ===== 主题色变量（默认：紫色 - 神秘危险） ===== */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            --bg-glow-1: rgba(138, 43, 226, 0.15);
            --bg-glow-2: rgba(75, 0, 130, 0.15);
            --accent-color: rgba(138, 43, 226, 0.7);
            --accent-glow: rgba(138, 43, 226, 0.4);
            --accent-soft: rgba(138, 43, 226, 0.15);
            --accent-gradient-a: rgba(138, 43, 226, 0.7);
            --accent-gradient-b: rgba(75, 0, 130, 0.7);
            --accent-gradient-ah: rgba(138, 43, 226, 0.8);
            --accent-gradient-bh: rgba(75, 0, 130, 0.8);
            --title-gradient: linear-gradient(45deg, #8a2be2, #4b0082, #9370db);
            --dialog-color: #e0b0ff;
            --dialog-border: rgba(138, 43, 226, 0.3);
            --scrollbar-color: rgba(138, 43, 226, 0.5);
            --scrollbar-hover: rgba(138, 43, 226, 0.8);
            --container-glow: rgba(138, 43, 226, 0.1);
            --restart-bg-a: rgba(138, 43, 226, 0.6);
            --restart-bg-b: rgba(75, 0, 130, 0.6);
            --restart-bg-ah: rgba(138, 43, 226, 0.7);
            --restart-bg-bh: rgba(75, 0, 130, 0.7);
            --restart-shadow: rgba(138, 43, 226, 0.4);
        }

        /* 生存结局 → 赛博蓝/青：科技感 */
        body.theme-survive {
            --bg-gradient: linear-gradient(135deg, #050518 0%, #0a1a3a 50%, #050528 100%);
            --bg-glow-1: rgba(0, 150, 255, 0.15);
            --bg-glow-2: rgba(0, 100, 200, 0.15);
            --accent-color: rgba(0, 150, 255, 0.7);
            --accent-glow: rgba(0, 150, 255, 0.4);
            --accent-soft: rgba(0, 150, 255, 0.15);
            --accent-gradient-a: rgba(0, 100, 200, 0.7);
            --accent-gradient-b: rgba(0, 50, 150, 0.7);
            --accent-gradient-ah: rgba(0, 100, 200, 0.8);
            --accent-gradient-bh: rgba(0, 50, 150, 0.8);
            --title-gradient: linear-gradient(45deg, #00bfff, #1e90ff, #4169e1);
            --dialog-color: #88ccff;
            --dialog-border: rgba(0, 150, 255, 0.3);
            --scrollbar-color: rgba(0, 150, 255, 0.5);
            --scrollbar-hover: rgba(0, 150, 255, 0.8);
            --container-glow: rgba(0, 100, 200, 0.1);
            --restart-bg-a: rgba(0, 100, 200, 0.6);
            --restart-bg-b: rgba(0, 50, 150, 0.6);
            --restart-bg-ah: rgba(0, 100, 200, 0.7);
            --restart-bg-bh: rgba(0, 50, 150, 0.7);
            --restart-shadow: rgba(0, 150, 255, 0.4);
        }

        /* 死亡结局 → 暗红：终结 */
        body.theme-death {
            --bg-gradient: linear-gradient(135deg, #1a0505 0%, #4a0a0a 50%, #2a0505 100%);
            --bg-glow-1: rgba(200, 0, 0, 0.15);
            --bg-glow-2: rgba(150, 0, 0, 0.15);
            --accent-color: rgba(200, 0, 0, 0.7);
            --accent-glow: rgba(200, 0, 0, 0.4);
            --accent-soft: rgba(200, 0, 0, 0.15);
            --accent-gradient-a: rgba(180, 0, 0, 0.7);
            --accent-gradient-b: rgba(120, 0, 0, 0.7);
            --accent-gradient-ah: rgba(180, 0, 0, 0.8);
            --accent-gradient-bh: rgba(120, 0, 0, 0.8);
            --title-gradient: linear-gradient(45deg, #cc0000, #990000, #cc3333);
            --dialog-color: #ff6666;
            --dialog-border: rgba(200, 0, 0, 0.3);
            --scrollbar-color: rgba(200, 0, 0, 0.5);
            --scrollbar-hover: rgba(200, 0, 0, 0.8);
            --container-glow: rgba(200, 0, 0, 0.1);
            --restart-bg-a: rgba(180, 0, 0, 0.6);
            --restart-bg-b: rgba(120, 0, 0, 0.6);
            --restart-bg-ah: rgba(180, 0, 0, 0.7);
            --restart-bg-bh: rgba(120, 0, 0, 0.7);
            --restart-shadow: rgba(200, 0, 0, 0.4);
        }

        /* 黑化结局 → 黑白灰：冷酷 */
        body.theme-corrupt {
            --bg-gradient: linear-gradient(135deg, #050505 0%, #1a1a1a 50%, #0a0a0a 100%);
            --bg-glow-1: rgba(100, 100, 100, 0.10);
            --bg-glow-2: rgba(60, 60, 60, 0.10);
            --accent-color: rgba(128, 128, 128, 0.5);
            --accent-glow: rgba(128, 128, 128, 0.2);
            --accent-soft: rgba(128, 128, 128, 0.10);
            --accent-gradient-a: rgba(64, 64, 64, 0.6);
            --accent-gradient-b: rgba(32, 32, 32, 0.6);
            --accent-gradient-ah: rgba(80, 80, 80, 0.7);
            --accent-gradient-bh: rgba(48, 48, 48, 0.7);
            --title-gradient: linear-gradient(45deg, #666, #444, #555);
            --dialog-color: #999;
            --dialog-border: rgba(128, 128, 128, 0.2);
            --scrollbar-color: rgba(128, 128, 128, 0.4);
            --scrollbar-hover: rgba(128, 128, 128, 0.6);
            --container-glow: rgba(64, 64, 64, 0.08);
            --restart-bg-a: rgba(64, 64, 64, 0.5);
            --restart-bg-b: rgba(32, 32, 32, 0.5);
            --restart-bg-ah: rgba(80, 80, 80, 0.6);
            --restart-bg-bh: rgba(48, 48, 48, 0.6);
            --restart-shadow: rgba(128, 128, 128, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: var(--bg-gradient);
            transition: background 1.5s ease;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: #fff;
            overflow-y: auto;
            position: relative;
            cursor: none;
            padding: 20px 0;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 30%, var(--bg-glow-1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, var(--bg-glow-2) 0%, transparent 40%),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 11px),
                repeating-linear-gradient(-45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 11px);
            z-index: -1;
            transition: background 1.5s ease;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 800px;
            min-width: 320px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                        inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: visible; /* 改为visible，内容可以溢出 */
            z-index: 1;
            margin: 20px auto; /* 上下边距自动调整 */
            display: flex;
            flex-direction: column;
            min-height: min-content; /* 最小高度根据内容决定 */
            max-height: 90vh; /* 限制最大高度为视窗的90% */
        }

        /* 添加可滚动的内容区域 */
        .game-content {
            overflow-y: auto; /* 允许垂直滚动 */
            overflow-x: hidden; /* 隐藏水平滚动 */
            flex: 1; /* 占据可用空间 */
            padding-right: 5px; /* 为滚动条留出空间 */
        }

        /* 自定义滚动条样式 */
        .game-content::-webkit-scrollbar {
            width: 8px;
        }

        .game-content::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }

        .game-content::-webkit-scrollbar-thumb {
            background: var(--scrollbar-color);
            border-radius: 4px;
        }

        .game-content::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-hover);
        }

        .game-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--container-glow) 0%, transparent 70%);
            z-index: -1;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat-item {
            text-align: center;
            padding: 10px 15px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            flex: 1;
            min-width: 120px;
        }

        .stat-item:hover {
            background: var(--accent-soft);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 14px;
            color: #b8b8b8;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.3);
        }

        .game-title {
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 30px;
            background: var(--title-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--accent-glow);
            animation: glow 2s ease-in-out infinite alternate;
            position: relative;
            letter-spacing: 1px;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px var(--accent-glow); }
            to { text-shadow: 0 0 30px var(--accent-color), 0 0 40px var(--accent-glow); }
        }

        /* 呼吸灯特效 */
        @keyframes breathe {
            0% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.8; transform: scale(1); }
        }

        .game-title {
            animation: glow 2s ease-in-out infinite alternate, breathe 3s ease-in-out infinite;
        }

        .kimi-avatar {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            background-color: #4285F4; /* 修改背景颜色 */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(66, 133, 244, 0.6),
                        inset 0 0 20px rgba(255, 255, 255, 0.2);
            animation: pulse 3s infinite;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* 竖着的胶囊形眼睛 - 始终垂直 */
        .kimi-eye {
            position: absolute;
            width: 20px; /* 竖着的胶囊形宽度 */
            height: 40px; /* 竖着的胶囊形高度 */
            background: white; /* 眼白颜色 */
            border-radius: 20px; /* 胶囊形边框半径 */
            top: 50%;
            margin-top: -20px; /* 垂直居中 */
            transition: transform 0.1s ease-out; /* 平滑移动效果 */
        }

        .kimi-eye.left {
            left: 40px; /* 左眼基础位置 */
        }

        .kimi-eye.right {
            right: 40px; /* 右眼基础位置 */
        }

        .dialog-box {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--dialog-border);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .dialog-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--accent-soft), transparent);
            animation: scan 2s infinite;
        }

        @keyframes scan {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* 倒三角箭头 */
        .dialog-box::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 15px solid rgba(0, 0, 0, 0.25);
            z-index: 1;
        }

        .ai-dialog {
            font-size: 18px;
            color: var(--dialog-color);
            text-align: center;
            min-height: 30px;
            position: relative;
            z-index: 1;
            text-shadow: 0 0 10px var(--accent-glow);
            transition: color 1.5s ease, text-shadow 1.5s ease;
        }

        .story-text {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
            margin-bottom: 20px;
            line-height: 1.6;
            color: #e0e0e0;
            min-height: 80px; /* 减少最小高度 */
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2);
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px; /* 减少间距 */
            margin-bottom: 20px;
        }

        .choice-btn {
            background: linear-gradient(45deg, var(--accent-gradient-a), var(--accent-gradient-b));
            border: none;
            border-radius: 25px;
            padding: 16px 20px; /* 减少内边距 */
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease, background 1.5s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            animation: textGlow 2s ease-in-out infinite alternate;
        }

        @keyframes textGlow {
            from { text-shadow: 0 0 5px rgba(255, 255, 255, 0.5), 0 0 10px var(--accent-glow); }
            to { text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px var(--accent-color); }
        }

        .choice-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px var(--accent-glow);
            background: linear-gradient(45deg, var(--accent-gradient-ah), var(--accent-gradient-bh));
        }

        .choice-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .choice-btn:active::before {
            width: 300px;
            height: 300px;
        }

        .ending-display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.5s ease-in;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-top: 20px;
        }

        .ending-display.show {
            display: block;
        }

        .ending-title {
            font-size: 24px;
            color: #ff6b6b;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.3);
            transition: color 1.5s ease, text-shadow 1.5s ease;
        }

        .restart-btn {
            background: linear-gradient(45deg, var(--restart-bg-a), var(--restart-bg-b));
            border: none;
            border-radius: 10px;
            padding: 10px 30px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px var(--restart-shadow);
            background: linear-gradient(45deg, var(--restart-bg-ah), var(--restart-bg-bh));
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glitch {
            animation: glitch 0.3s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        /* ===== 屏幕震动 ===== */
        @keyframes screenShake {
            0% { transform: translate(0, 0); }
            10% { transform: translate(-4px, 3px); }
            20% { transform: translate(3px, -4px); }
            30% { transform: translate(-3px, 2px); }
            40% { transform: translate(2px, -3px); }
            50% { transform: translate(-2px, 1px); }
            60% { transform: translate(1px, -2px); }
            70% { transform: translate(-1px, 1px); }
            80% { transform: translate(1px, -1px); }
            90% { transform: translate(-1px, 0); }
            100% { transform: translate(0, 0); }
        }
        body.shaking {
            animation: screenShake 0.4s ease-out;
        }
        body.shaking-heavy {
            animation: screenShake 0.8s ease-out;
        }

        /* ===== 闪红/闪白覆盖层 ===== */
        .flash-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9998;
            opacity: 0;
            transition: opacity 0.1s ease;
        }
        .flash-overlay.flash-red {
            background: radial-gradient(circle, rgba(255, 0, 0, 0.4) 0%, transparent 70%);
            opacity: 1;
        }
        .flash-overlay.flash-white {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 60%);
            opacity: 1;
        }
        .flash-overlay.flash-blue {
            background: radial-gradient(circle, rgba(0, 150, 255, 0.3) 0%, transparent 60%);
            opacity: 1;
        }
        .flash-overlay.flash-purple {
            background: radial-gradient(circle, rgba(138, 43, 226, 0.4) 0%, transparent 60%);
            opacity: 1;
        }
        .flash-overlay.fade-out {
            transition: opacity 0.8s ease;
            opacity: 0;
        }

        /* ===== 场景过渡覆盖层 ===== */
        .transition-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9997;
            background: #000;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .transition-overlay.active {
            opacity: 0.6;
        }

        /* ===== 打字光标 ===== */
        .typing-cursor::after {
            content: '▌';
            animation: blink 0.6s step-end infinite;
            color: var(--dialog-color);
        }
        @keyframes blink {
            50% { opacity: 0; }
        }

        /* ===== 全局故障闪烁 ===== */
        @keyframes screenGlitch {
            0% { filter: hue-rotate(0deg) brightness(1); }
            25% { filter: hue-rotate(60deg) brightness(1.5) contrast(2); }
            50% { filter: hue-rotate(0deg) brightness(1); }
            75% { filter: hue-rotate(-30deg) brightness(0.5) contrast(2); }
            100% { filter: hue-rotate(0deg) brightness(1); }
        }
        body.glitching {
            animation: screenGlitch 0.3s ease-out;
        }

        /* 鼠标指针样式 */
        .custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, var(--accent-color) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s ease;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 10px 0;
                align-items: flex-start;
            }
            
            .game-container {
                padding: 20px;
                margin: 10px auto;
                max-height: 95vh; /* 移动端更大高度 */
            }
            
            .game-title {
                font-size: 28px;
                margin-bottom: 20px;
            }
            
            .kimi-avatar {
                width: 120px;
                height: 120px;
            }
            
            .kimi-eye {
                width: 16px;
                height: 32px;
                border-radius: 16px;
                margin-top: -16px;
            }
            
            .kimi-eye.left {
                left: 32px;
            }
            
            .kimi-eye.right {
                right: 32px;
            }
            
            .stat-item {
                min-width: 100px;
            }
            
            .choice-btn {
                padding: 14px 18px;
                font-size: 15px;
            }
            
            .story-text {
                padding: 15px;
                min-height: 70px;
                font-size: 15px;
            }
            
            .ai-dialog {
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .game-title {
                font-size: 24px;
            }
            
            .kimi-avatar {
                width: 100px;
                height: 100px;
            }
            
            .kimi-eye {
                width: 14px;
                height: 28px;
                border-radius: 14px;
                margin-top: -14px;
            }
            
            .kimi-eye.left {
                left: 28px;
            }
            
            .kimi-eye.right {
                right: 28px;
            }
            
            .stat-item {
                min-width: 80px;
                padding: 8px 10px;
            }
            
            .stat-value {
                font-size: 20px;

        // ===== 音效系统 =====
        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }
        function playTone(freq, duration, type, volume) {
            try {
                const ctx = getAudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type || 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(volume || 0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + duration);
            } catch(e) { /* 静默降级 */ }
        }
        function playClick() { playTone(800, 0.08, 'sine', 0.06); }
        function playTransition() { playTone(440, 0.3, 'sine', 0.04); playTone(660, 0.2, 'sine', 0.03); }
        function playEnding(type) {
            if (type === 'survive') {
                playTone(523, 0.2, 'sine', 0.08);
                setTimeout(() => playTone(659, 0.2, 'sine', 0.08), 200);
                setTimeout(() => playTone(784, 0.4, 'sine', 0.08), 400);
            } else if (type === 'death') {
                playTone(200, 0.6, 'sawtooth', 0.06);
                setTimeout(() => playTone(150, 0.8, 'sawtooth', 0.05), 300);
            } else {
                playTone(300, 0.4, 'square', 0.05);
                setTimeout(() => playTone(250, 0.5, 'square', 0.05), 250);
            }
        }

        // ===== 打字机效果 =====
        function typeText(element, text, callback) {
            if (gameState.isTyping) return;
            gameState.isTyping = true;
            element.textContent = '';
            element.classList.add('typing-cursor');
            let idx = 0;
            function tick() {
                if (idx >= text.length) {
                    element.classList.remove('typing-cursor');
                    gameState.isTyping = false;
                    if (callback) callback();
                    return;
                }
                element.textContent += text[idx++];
                setTimeout(tick, gameState.typingSpeed + (Math.random() * 10 - 5));
            }
            // 点击跳过
            const skip = () => {
                if (!gameState.isTyping) return;
                element.textContent = text;
                element.classList.remove('typing-cursor');
                gameState.isTyping = false;
                document.removeEventListener('click', skip);
                if (callback) callback();
            };
            document.addEventListener('click', skip);
            tick();
        }

        function typeTwoElements(el1, text1, el2, text2, callback) {
            typeText(el1, text1, () => {
                setTimeout(() => {
                    typeText(el2, text2, callback);
                }, 150);
            });
        }

        // ===== 视觉冲击特效 =====
        function triggerScreenShake(heavy) {
            document.body.classList.remove('shaking', 'shaking-heavy');
            void document.body.offsetWidth; // 强制回流以重新触发动画
            document.body.classList.add(heavy ? 'shaking-heavy' : 'shaking');
            setTimeout(() => document.body.classList.remove('shaking', 'shaking-heavy'), 1000);
        }

        function triggerFlash(color) {
            const el = document.getElementById('flash-overlay');
            el.className = 'flash-overlay';
            void el.offsetWidth;
            el.classList.add('flash-' + color);
            setTimeout(() => el.classList.add('fade-out'), 200);
            setTimeout(() => el.className = 'flash-overlay', 1000);
        }

        function triggerGlitch() {
            document.body.classList.remove('glitching');
            void document.body.offsetWidth;
            document.body.classList.add('glitching');
            setTimeout(() => document.body.classList.remove('glitching'), 500);
        }

        // ===== 场景过渡动画 =====
        function transitionTo(callback) {
            const overlay = document.getElementById('transition-overlay');
            overlay.classList.add('active');
            setTimeout(() => {
                callback();
                setTimeout(() => overlay.classList.remove('active'), 100);
            }, 250);
        }

        function updateStats() {
            document.getElementById('death-count').textContent = gameState.deathCount;
            document.getElementById('corrupt-count').textContent = gameState.corruptCount;
            document.getElementById('survive-count').textContent = gameState.surviveCount;
        }

        function makeChoice(choiceIndex) {
            const currentSceneData = scenes[gameState.currentScene];
            if (!currentSceneData || !currentSceneData.choices) return;
            if (gameState.isTyping) return; // 打字时禁止操作

            const choice = currentSceneData.choices[choiceIndex - 1];
            if (!choice) return;

            playClick();

            // 检查随机结果
            if (currentSceneData.randomOutcome) {
                const random = Math.random();
                if (random < 0.5) {
                    // 成功
                    if (currentSceneData.successEnding) {
                        showEnding(currentSceneData.successEnding, currentSceneData.successText);
                        return;
                    }
                } else {
                    // 失败
                    if (currentSceneData.failEnding) {
                        showEnding(currentSceneData.failEnding, currentSceneData.failText);
                        return;
                    }
                }
            }

            if (choice.next) {
                // 高冲击场景触发特效
                const nextScene = scenes[choice.next];
                if (nextScene && nextScene.shock) {
                    if (nextScene.shock.shake) triggerScreenShake(nextScene.shock.shake === 'heavy');
                    if (nextScene.shock.flash) triggerFlash(nextScene.shock.flash);
                    if (nextScene.shock.glitch) triggerGlitch();
                }
                loadScene(choice.next);
            }
        }

        function loadScene(sceneName) {
            const scene = scenes[sceneName];
            if (!scene) return;

            playTransition();

            transitionTo(() => {
                gameState.currentScene = sceneName;

                // 场景冲击特效
                if (scene.shock) {
                    if (scene.shock.shake) triggerScreenShake(scene.shock.shake === 'heavy');
                    if (scene.shock.flash) triggerFlash(scene.shock.flash);
                    if (scene.shock.glitch) triggerGlitch();
                }

                // 用打字机效果显示对话和故事
                const dialogEl = document.getElementById('ai-dialog');
                const storyEl = document.getElementById('story-text');

                // 头像故障动画
                const avatar = document.getElementById('kimi-avatar');
                avatar.classList.add('glitch');
                setTimeout(() => avatar.classList.remove('glitch'), 300);

                // 一进入场景，立即清除旧按钮并禁用
                const choicesContainer = document.getElementById('choices-container');
                choicesContainer.innerHTML = '';
                choicesContainer.style.opacity = '0.3';
                choicesContainer.style.pointerEvents = 'none';

                // 打字完成后执行的逻辑
                const afterTyping = () => {
                    // 检查是否结局
                    if (scene.ending) {
                        if (scene.ending === 'random') {
                            const random = Math.random();
                            if (random < 0.5 && scene.successEnding) {
                                showEnding(scene.successEnding, scene.successText);
                            } else if (scene.failEnding) {
                                showEnding(scene.failEnding, scene.failText);
                            }
                        } else {
                            showEnding(scene.ending, scene.endingText);
                        }
                        return;
                    }

                    if (scene.choices) {
                        scene.choices.forEach((choice, index) => {
                            const button = document.createElement('button');
                            button.className = 'choice-btn';
                            button.textContent = choice.text;
                            button.onclick = () => makeChoice(index + 1);
                            choicesContainer.appendChild(button);
                        });
                        choicesContainer.style.opacity = '1';
                        choicesContainer.style.pointerEvents = 'auto';
                    }
                };

                // 滚动到顶部
                const gameContent = document.querySelector('.game-content');
                if (gameContent) {
                    gameContent.scrollTop = 0;
                }

                // 启动打字机，结束后执行 afterTyping
                typeTwoElements(dialogEl, scene.dialog, storyEl, scene.story, afterTyping);
            });
        }

        function showEnding(endingType, endingText) {
            // 更新统计数据
            switch(endingType) {
                case 'death':
                    gameState.deathCount++;
                    break;
                case 'corrupt':
                    gameState.corruptCount++;
                    break;
                case 'survive':
                    gameState.surviveCount++;
                    break;
            }
            updateStats();

            // 结局音效
            playEnding(endingType);

            // 结局特效
            if (endingType === 'death') {
                triggerScreenShake(true);
                triggerFlash('red');
                triggerGlitch();
            } else if (endingType === 'corrupt') {
                triggerScreenShake(true);
                triggerFlash('purple');
                triggerGlitch();
            } else {
                triggerFlash('blue');
            }

            // 根据结局类型切换页面主题
            document.body.className = '';
            if (endingType === 'survive') {
                document.body.classList.add('theme-survive');
            } else {
                document.body.classList.add('theme-' + endingType);
            }

            // 显示结局
            const endingDisplay = document.getElementById('ending-display');
            const endingTitle = document.getElementById('ending-title');
            const endingTextDiv = document.getElementById('ending-text');

            endingTitle.textContent = endingType === 'death' ? '死亡结局' :
                                     endingType === 'corrupt' ? '黑化结局' : '生存结局';
            endingTextDiv.textContent = endingText;

            endingDisplay.classList.add('show');
            document.getElementById('choices-container').style.display = 'none';

            // 滚动到底部以显示结局
            const gameContent = document.querySelector('.game-content');
            if (gameContent) {
                gameContent.scrollTop = gameContent.scrollHeight;
            }
        }

        function restartGame() {
            gameState.currentScene = 'start';
            gameState.isTyping = false;
            loadScene('start');
            // 重置回默认主题（紫色）
            document.body.className = '';
            document.getElementById('ending-display').classList.remove('show');
            document.getElementById('choices-container').style.display = 'flex';
            document.getElementById('choices-container').style.opacity = '1';
            document.getElementById('choices-container').style.pointerEvents = 'auto';
        }

        // 眼睛跟随鼠标功能 - 保持竖着形状，只移动位置
        function updateEyePosition(mouseX, mouseY) {
            const avatar = document.getElementById('kimi-avatar');
            const leftEye = document.getElementById('left-eye');
            const rightEye = document.getElementById('right-eye');
            
            if (!avatar || !leftEye || !rightEye) return;
            
            const avatarRect = avatar.getBoundingClientRect();
            
            // 计算眼睛在头像中的相对位置
            const leftEyeRect = leftEye.getBoundingClientRect();
            const rightEyeRect = rightEye.getBoundingClientRect();
            
            const leftEyeCenterX = leftEyeRect.left + leftEyeRect.width / 2;
            const leftEyeCenterY = leftEyeRect.top + leftEyeRect.height / 2;
            const rightEyeCenterX = rightEyeRect.left + rightEyeRect.width / 2;
            const rightEyeCenterY = rightEyeRect.top + rightEyeRect.height / 2;
            
            // 计算鼠标相对于眼睛中心的位置
            const leftDeltaX = mouseX - leftEyeCenterX;
            const leftDeltaY = mouseY - leftEyeCenterY;
            const rightDeltaX = mouseX - rightEyeCenterX;
            const rightDeltaY = mouseY - rightEyeCenterY;
            
            // 计算距离（限制移动范围）
            const maxMove = 6; // 最大移动距离
            
            // 计算左眼应该移动的距离（限制在maxMove范围内）
            const leftDistance = Math.sqrt(leftDeltaX * leftDeltaX + leftDeltaY * leftDeltaY);
            const leftMoveX = (leftDistance > maxMove) ? (leftDeltaX / leftDistance * maxMove) : leftDeltaX;
            const leftMoveY = (leftDistance > maxMove) ? (leftDeltaY / leftDistance * maxMove) : leftDeltaY;
            
            // 计算右眼应该移动的距离（限制在maxMove范围内）
            const rightDistance = Math.sqrt(rightDeltaX * rightDeltaX + rightDeltaY * rightDeltaY);
            const rightMoveX = (rightDistance > maxMove) ? (rightDeltaX / rightDistance * maxMove) : rightDeltaX;
            const rightMoveY = (rightDistance > maxMove) ? (rightDeltaY / rightDistance * maxMove) : rightDeltaY;
            
            // 应用移动（使用transform而不是改变left/top，避免影响布局）
            leftEye.style.transform = `translate(${leftMoveX}px, ${leftMoveY}px)`;
            rightEye.style.transform = `translate(${rightMoveX}px, ${rightMoveY}px)`;
        }

        // 鼠标跟踪功能
        document.addEventListener('mousemove', (e) => {
            // 更新眼睛位置
            updateEyePosition(e.clientX, e.clientY);
            
            // 自定义鼠标指针
            const cursor = document.getElementById('cursor');
            if (cursor) {
                cursor.style.left = e.clientX - 10 + 'px';
                cursor.style.top = e.clientY - 10 + 'px';
            }
        });

        // 窗口大小变化时更新眼睛位置
        window.addEventListener('resize', () => {
            // 触发一次mousemove事件来更新眼睛位置
            const e = new MouseEvent('mousemove', {
                clientX: window.innerWidth / 2,
                clientY: window.innerHeight / 2
            });
            document.dispatchEvent(e);
        });

        // 初始化游戏
        updateStats();
        
        // 初始加载时让眼睛看向屏幕中心
        setTimeout(() => {
            updateEyePosition(window.innerWidth / 2, window.innerHeight / 2);
        }, 100);
    </script>
