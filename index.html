<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Domain</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            
            body {
                min-height: 100vh;
                background: #000;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-end;
                position: relative;
                overflow: hidden;
                padding-bottom: 20px;
            }
            
            /* 图片容器 - 最底层 */
            .image-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 1;
            }
            
            img {
                width: 100vw; /* 与屏幕宽度一致 */
                height: auto;
                display: block;
            }
            
            /* 底部红色光晕 */
            .glow {
                position: fixed;
                bottom: -30%;
                left: 50%;
                transform: translateX(-50%);
                width: 100%;
                height: 80%;
                background: radial-gradient(ellipse at center, rgba(220, 20, 60, 0.15) 0%, transparent 60%);
                pointer-events: none;
                z-index: 2;
            }
            
            /* 文字 */
            p {
                color: #fff;
                font-family: 'Arial Black', sans-serif;
                font-size: 2rem;
                z-index: 3;
                position: relative;
                letter-spacing: 2px;
                background: linear-gradient(90deg, #fff, #ff4444, #fff);
                background-size: 200% auto;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                animation: shine 3s linear infinite;
            }
            
            @keyframes shine {
                to { background-position: 200% center; }
            }
            
            /* 星星粒子 - 最顶层 */
            .stars {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 10;
            }
            
            .star {
                position: absolute;
                width: 2px;
                height: 2px;
                background: rgba(220, 20, 60, 0.8);
                border-radius: 50%;
                box-shadow: 0 0 4px rgba(220, 20, 60, 0.8);
                animation: twinkle 2s infinite;
            }
            
            .star.white {
                background: rgba(255, 255, 255, 0.9);
                box-shadow: 0 0 4px rgba(255, 255, 255, 0.9);
            }
            
            @keyframes twinkle {
                0%, 100% { opacity: 0.2; transform: scale(1); }
                50% { opacity: 1; transform: scale(1.3); }
            }
        </style>
    </head>
    <body>
        <div class="image-container">
            <img src="images/Domain.jpg" alt="Domain" loading="eager" decoding="async">
        </div>
        <div class="glow"></div>
        <p>This is a Domain</p>
        <div class="stars" id="stars"></div>

        <script>
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = Math.random() > 0.85 ? 'star white' : 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                star.style.animationDuration = (1.5 + Math.random() * 2) + 's';
                starsContainer.appendChild(star);
            }
        </script>
    </body>
</html>
