<!DOCTYPE html>
<html lang="en" translate="no">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>This is a Domain</title>
        <meta name="description" content="Neon line-art character illustration — Domain.">
        <meta name="color-scheme" content="dark">
        <meta name="theme-color" content="#000000">
        <meta name="google" content="notranslate">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://valedecem.top/">
        <meta property="og:title" content="This is a Domain">
        <meta property="og:description" content="Neon line-art character illustration — Domain.">
        <meta property="og:image" content="https://valedecem.top/images/Domain.jpg">
        <link rel="icon" href="images/icon.ico">
        <style>
            :root {
                --accent: rgba(220, 20, 60, 0.8);
                --accent-weak: rgba(220, 20, 60, 0.5);
                --violet: rgba(147, 51, 234, 0.4);
                /* 指针位置，-1 ~ 1，由脚本写入，供各层视差取用 */
                --px: 0;
                --py: 0;
            }
            
            * { margin: 0; padding: 0; box-sizing: border-box; }
            
            body {
                min-height: 100vh;
                min-height: 100dvh;
                background: #000;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-end;
                position: relative;
                overflow: hidden;
                padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px));
            }
            
            /* Win11 OOBE 风格光晕 —— 位于画作之下，只照亮画作周围的黑暗 */
            .glow {
                position: fixed;
                inset: 0;
                pointer-events: none;
                z-index: 1;
                transform: translate3d(calc(var(--px) * -30px), calc(var(--py) * -30px), 0);
            }
            
            /* 光斑基础样式 */
            .glow-blob {
                position: absolute;
                border-radius: 50%;
                filter: blur(40px);
            }
            
            /* 光斑1 - 蓝紫色调 更大更淡 */
            .glow-blob-1 {
                top: -30%;
                left: -20%;
                width: 100vmin;
                height: 100vmin;
                background: radial-gradient(circle, 
                    rgba(147, 51, 234, 0.45) 0%, 
                    rgba(88, 28, 135, 0.3) 30%, 
                    rgba(220, 20, 60, 0.15) 60%, 
                    transparent 80%
                );
                animation: blob-wander-1 20s ease-in-out infinite;
            }
            
            /* 光斑2 - 深红色调 更大更淡 */
            .glow-blob-2 {
                top: 100%;
                left: 100%;
                width: 90vmin;
                height: 90vmin;
                background: radial-gradient(circle, 
                    rgba(220, 20, 60, 0.4) 0%, 
                    rgba(178, 34, 34, 0.25) 40%, 
                    rgba(255, 69, 0, 0.15) 70%, 
                    transparent 85%
                );
                animation: blob-wander-2 25s ease-in-out infinite;
            }
            
            /* 光斑3 - 橙红色调，尾部补一道淡紫 更大更淡 */
            .glow-blob-3 {
                top: 50%;
                left: 50%;
                margin: -40vmin 0 0 -40vmin;
                width: 80vmin;
                height: 80vmin;
                background: radial-gradient(circle, 
                    rgba(255, 69, 0, 0.35) 0%, 
                    rgba(220, 20, 60, 0.25) 50%, 
                    rgba(147, 51, 234, 0.12) 68%, 
                    transparent 84%
                );
                animation: blob-wander-3 18s ease-in-out infinite;
            }
            
            /* 漫游动画只改 transform，避免每帧触发布局与重绘 */
            /* 光斑1 - 大范围漫游 */
            @keyframes blob-wander-1 {
                0% { transform: translate3d(0, 0, 0) scale(1); }
                20% { transform: translate3d(80vw, 90vh, 0) scale(1.2); }
                40% { transform: translate3d(100vw, 40vh, 0) scale(0.9); }
                60% { transform: translate3d(50vw, 100vh, 0) scale(1.1); }
                80% { transform: translate3d(30vw, 60vh, 0) scale(1.15); }
                100% { transform: translate3d(0, 0, 0) scale(1); }
            }
            
            /* 光斑2 - 对角线穿越 */
            @keyframes blob-wander-2 {
                0% { transform: translate3d(0, 0, 0) scale(1.1); }
                25% { transform: translate3d(-90vw, -100vh, 0) scale(0.85); }
                50% { transform: translate3d(-60vw, -50vh, 0) scale(1.25); }
                75% { transform: translate3d(-30vw, -80vh, 0) scale(0.95); }
                100% { transform: translate3d(0, 0, 0) scale(1.1); }
            }
            
            /* 光斑3 - 中心环绕 */
            @keyframes blob-wander-3 {
                0% { transform: translate3d(0, 0, 0) scale(1); }
                15% { transform: translate3d(-45vw, 25vh, 0) scale(1.15); }
                30% { transform: translate3d(15vw, 15vh, 0) scale(0.85); }
                45% { transform: translate3d(25vw, -35vh, 0) scale(1.2); }
                60% { transform: translate3d(-35vw, -45vh, 0) scale(1.05); }
                75% { transform: translate3d(-15vw, 35vh, 0) scale(0.8); }
                90% { transform: translate3d(35vw, -5vh, 0) scale(1.1); }
                100% { transform: translate3d(0, 0, 0) scale(1); }
            }
            
            /* 画作 - 任何宽高比都完整显示，不裁切王冠与下摆 */
            /* screen 混合：黑底让光晕透出来，霓虹线条保持锐利且不被染色 */
            /* 随指针轻微倾斜，配合光晕与粒子形成景深 */
            .art {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: block;
                mix-blend-mode: screen;
                transform-origin: 50% 46%;
                transform: perspective(1400px) 
                    rotateX(calc(var(--py) * 3.5deg)) 
                    rotateY(calc(var(--px) * -4deg));
                z-index: 2;
            }
            
            /* 火星粒子 */
            .embers {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 5;
                transform: translate3d(calc(var(--px) * 12px), calc(var(--py) * 12px), 0);
            }
            
            /* 底部渐隐遮罩，保证标题压在画面上也清晰 */
            body::after {
                content: '';
                position: fixed;
                inset: auto 0 0 0;
                height: 34vh;
                background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
                pointer-events: none;
                z-index: 3;
            }
            
            /* 文字 */
            h1 {
                color: #fff;
                font-family: 'Arial Black', sans-serif;
                font-size: clamp(1.5rem, 4vw, 2.5rem);
                z-index: 4;
                position: relative;
                letter-spacing: 2px;
                background: linear-gradient(90deg, #fff, #ff4444, #fff);
                background-size: 200% auto;
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
                animation: shine 3s linear infinite;
                text-shadow: 0 0 30px var(--accent-weak), 0 0 60px var(--violet);
            }
            
            @keyframes shine {
                to { background-position: 200% center; }
            }
            
            /* 星星粒子 - 最顶层 */
            .stars {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                z-index: 10;
                transform: translate3d(calc(var(--px) * 16px), calc(var(--py) * 16px), 0);
            }
            
            .star {
                position: absolute;
                width: 2px;
                height: 2px;
                background: var(--accent);
                border-radius: 50%;
                box-shadow: 0 0 4px var(--accent);
                animation: twinkle 2s infinite;
            }
            
            .star.white {
                background: rgba(255, 255, 255, 0.9);
                box-shadow: 0 0 4px rgba(255, 255, 255, 0.9);
            }
            
            @keyframes twinkle {
                0%, 100% { opacity: 0.2; transform: scale(1); }
                50% { opacity: 1; transform: scale(1.3); }
            }
            
            /* 减少动画偏好：动画关闭后光斑仍要停在合理位置，不能塌到角落；视差与火星完全不启用 */
            @media (prefers-reduced-motion: reduce) {
                .glow-blob,
                .star,
                h1 {
                    animation: none;
                }
                .glow-blob {
                    opacity: 0.4;
                }
                .glow-blob-1 {
                    top: -25%;
                    left: -15%;
                }
                .glow-blob-2 {
                    top: 35%;
                    left: 45%;
                }
                .glow-blob-3 {
                    top: 45%;
                    left: 55%;
                }
                .glow,
                .art,
                .stars,
                .embers {
                    transform: none;
                }
                /* 动画关闭后星星会全部停在最亮状态，压暗一档 */
                .star {
                    opacity: 0.55;
                }
            }
        </style>
    </head>
    <body>
        <div class="glow" aria-hidden="true">
            <div class="glow-blob glow-blob-1"></div>
            <div class="glow-blob glow-blob-2"></div>
            <div class="glow-blob glow-blob-3"></div>
        </div>
        <img class="art" src="images/Domain.jpg" alt="" width="1065" height="1138" fetchpriority="high" decoding="async">
        <canvas class="embers" id="embers" aria-hidden="true"></canvas>
        <h1>This is a Domain</h1>
        <div class="stars" id="stars" aria-hidden="true"></div>

        <script>
            const root = document.documentElement;
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            /* 星星粒子 */
            const starsContainer = document.getElementById('stars');
            const starCount = window.innerWidth < 768 ? 32 : 48;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = Math.random() > 0.85 ? 'star white' : 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                star.style.animationDuration = (1.5 + Math.random() * 2) + 's';
                starsContainer.appendChild(star);
            }

            if (!reduceMotion) {
                /* ---- 指针视差 ---- */
                let targetX = 0, targetY = 0, currentX = 0, currentY = 0;
                let pointerActive = false;

                window.addEventListener('pointermove', (e) => {
                    targetX = (e.clientX / window.innerWidth) * 2 - 1;
                    targetY = (e.clientY / window.innerHeight) * 2 - 1;
                    pointerActive = true;
                }, { passive: true });

                window.addEventListener('pointerleave', () => { pointerActive = false; });
                ['pointerup', 'pointercancel'].forEach((type) => {
                    window.addEventListener(type, (e) => {
                        if (e.pointerType !== 'mouse') pointerActive = false;
                    }, { passive: true });
                });

                /* ---- 火星粒子 ---- */
                const canvas = document.getElementById('embers');
                const ctx = canvas.getContext('2d');
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                const embers = [];

                function makeSprite(rgb) {
                    const size = 32;
                    const sprite = document.createElement('canvas');
                    sprite.width = sprite.height = size;
                    const g = sprite.getContext('2d');
                    const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
                    grad.addColorStop(0, 'rgba(' + rgb + ', 1)');
                    grad.addColorStop(0.3, 'rgba(' + rgb + ', 0.45)');
                    grad.addColorStop(1, 'rgba(' + rgb + ', 0)');
                    g.fillStyle = grad;
                    g.fillRect(0, 0, size, size);
                    return sprite;
                }

                /* 暖橙红为主，掺少量紫罗兰 */
                const warmSprite = makeSprite('255, 96, 48');
                const violetSprite = makeSprite('168, 85, 247');

                function spawn(spreadOut) {
                    const r = 0.9 + Math.random() * 1.2;
                    return {
                        x: Math.random() * window.innerWidth,
                        y: spreadOut ? Math.random() * window.innerHeight : window.innerHeight + r * 4,
                        r: r,
                        speed: 14 + Math.random() * 24,
                        sway: 6 + Math.random() * 16,
                        swaySpeed: 0.4 + Math.random() * 0.9,
                        drift: (Math.random() - 0.5) * 8,
                        phase: Math.random() * Math.PI * 2,
                        life: 8 + Math.random() * 8,
                        age: spreadOut ? Math.random() * 8 : 0,
                        alpha: 0.25 + Math.random() * 0.45,
                        sprite: Math.random() < 0.28 ? violetSprite : warmSprite
                    };
                }

                function resize() {
                    const w = window.innerWidth;
                    const h = window.innerHeight;
                    canvas.width = Math.round(w * dpr);
                    canvas.height = Math.round(h * dpr);
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    const count = Math.round(Math.min(72, Math.max(12, (w * h) / 22000)));
                    if (embers.length > count) embers.length = count;
                    while (embers.length < count) embers.push(spawn(true));
                }

                window.addEventListener('resize', resize, { passive: true });
                resize();

                /* ---- 单一 rAF 同时驱动视差与火星 ---- */
                let last = 0;
                function frame(now) {
                    const dt = Math.min((now - last) / 1000, 0.05);
                    last = now;

                    if (!pointerActive) {
                        /* 没有指针时缓慢自转，画面不至于死掉 */
                        targetX = Math.sin(now / 9000) * 0.3;
                        targetY = Math.cos(now / 12000) * 0.25;
                    }
                    currentX += (targetX - currentX) * Math.min(1, dt * 2.4);
                    currentY += (targetY - currentY) * Math.min(1, dt * 2.4);
                    root.style.setProperty('--px', currentX.toFixed(4));
                    root.style.setProperty('--py', currentY.toFixed(4));

                    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                    ctx.globalCompositeOperation = 'lighter';
                    for (let i = 0; i < embers.length; i++) {
                        const e = embers[i];
                        e.age += dt;
                        if (e.age > e.life || e.y < -20) {
                            embers[i] = spawn(false);
                            continue;
                        }
                        e.y -= e.speed * dt;
                        e.x += (e.drift + Math.sin(e.age * e.swaySpeed + e.phase) * e.sway) * dt;

                        const t = e.age / e.life;
                        const fade = Math.min(1, t / 0.15) * Math.min(1, (1 - t) / 0.4);
                        ctx.globalAlpha = Math.max(0, e.alpha * fade);
                        const size = e.r * 6;
                        ctx.drawImage(e.sprite, e.x - size / 2, e.y - size / 2, size, size);
                    }
                    ctx.globalAlpha = 1;
                    ctx.globalCompositeOperation = 'source-over';

                    requestAnimationFrame(frame);
                }
                requestAnimationFrame(frame);
            }
        </script>
    </body>
</html>
