<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - SIGNAL LOST</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #0a0a0a;
            --accent-red: #ff003c;
            --accent-cyan: #00f0ff;
            --text-gray: #888;
            --grid-color: rgba(255, 0, 60, 0.1);
        }

        body {
            font-family: 'Space Mono', monospace;
            background-color: var(--bg-color);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* CRT扫描线效果 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
            animation: scanline 10s linear infinite;
        }

        @keyframes scanline {
            0% { transform: translateY(0); }
            100% { transform: translateY(10px); }
        }

        /* 网格背景 */
        .grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            perspective: 500px;
            transform-style: preserve-3d;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }

        .container {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 3rem;
            border: 2px solid var(--accent-red);
            background: rgba(10, 10, 10, 0.9);
            box-shadow: 
                0 0 20px rgba(255, 0, 60, 0.3),
                inset 0 0 20px rgba(255, 0, 60, 0.1);
            max-width: 600px;
            width: 90%;
            clip-path: polygon(
                0 20px, 20px 0, 
                calc(100% - 20px) 0, 100% 20px,
                100% calc(100% - 20px), calc(100% - 20px) 100%,
                20px 100%, 0 calc(100% - 20px)
            );
        }

        /* 狐狸容器 - 故障风格 */
        .fox-container {
            margin: 0 0 1.5rem 0;
            position: relative;
            display: inline-block;
            filter: grayscale(100%) contrast(120%) brightness(0.9);
        }

        .fox-image {
            width: 140px;
            height: auto;
            display: block;
            position: relative;
            z-index: 2;
            animation: foxFloat 4s ease-in-out infinite;
        }

        /* 狐狸的故障残影 */
        .fox-container::before,
        .fox-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://valedecem.top/images/fox.png') no-repeat center;
            background-size: 140px auto;
            pointer-events: none;
            opacity: 0.6;
            mix-blend-mode: screen;
        }

        .fox-container::before {
            transform: translate(-3px, 0);
            filter: hue-rotate(90deg) brightness(1.2);
            animation: foxGlitch1 3s infinite;
            z-index: 3;
        }

        .fox-container::after {
            transform: translate(3px, 0);
            filter: hue-rotate(180deg) brightness(1.2);
            animation: foxGlitch2 3s infinite 0.5s;
            z-index: 1;
        }

        @keyframes foxFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes foxGlitch1 {
            0%, 90%, 100% { opacity: 0; transform: translate(-3px, 0); }
            92% { opacity: 0.6; transform: translate(-5px, -2px); }
            94% { opacity: 0; transform: translate(-2px, 1px); }
            96% { opacity: 0.6; transform: translate(-4px, 0); }
        }

        @keyframes foxGlitch2 {
            0%, 85%, 100% { opacity: 0; transform: translate(3px, 0); }
            87% { opacity: 0.6; transform: translate(5px, 2px); }
            89% { opacity: 0; transform: translate(2px, -1px); }
            91% { opacity: 0.6; transform: translate(4px, 0); }
        }

        .glitch-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 6rem;
            font-weight: 700;
            color: #fff;
            position: relative;
            display: inline-block;
            letter-spacing: -0.05em;
            text-shadow: 
                0.05em 0 0 rgba(255, 0, 60, 0.75),
                -0.025em -0.05em 0 rgba(0, 240, 255, 0.75),
                0.025em 0.05em 0 rgba(0, 255, 0, 0.75);
            animation: glitch 2s infinite;
        }

        h1::before,
        h1::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
        }

        h1::before {
            left: 2px;
            text-shadow: -2px 0 var(--accent-red);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        h1::after {
            left: -2px;
            text-shadow: -2px 0 var(--accent-cyan);
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch {
            0% { text-shadow: 0.05em 0 0 rgba(255, 0, 60, 0.75), -0.05em -0.025em 0 rgba(0, 240, 255, 0.75), -0.025em 0.05em 0 rgba(0, 255, 0, 0.75); }
            14% { text-shadow: 0.05em 0 0 rgba(255, 0, 60, 0.75), -0.05em -0.025em 0 rgba(0, 240, 255, 0.75), -0.025em 0.05em 0 rgba(0, 255, 0, 0.75); }
            15% { text-shadow: -0.05em -0.025em 0 rgba(255, 0, 60, 0.75), 0.025em 0.025em 0 rgba(0, 240, 255, 0.75), -0.05em -0.05em 0 rgba(0, 255, 0, 0.75); }
            49% { text-shadow: -0.05em -0.025em 0 rgba(255, 0, 60, 0.75), 0.025em 0.025em 0 rgba(0, 240, 255, 0.75), -0.05em -0.05em 0 rgba(0, 255, 0, 0.75); }
            50% { text-shadow: 0.025em 0.05em 0 rgba(255, 0, 60, 0.75), 0.05em 0 0 rgba(0, 240, 255, 0.75), 0 -0.05em 0 rgba(0, 255, 0, 0.75); }
            99% { text-shadow: 0.025em 0.05em 0 rgba(255, 0, 60, 0.75), 0.05em 0 0 rgba(0, 240, 255, 0.75), 0 -0.05em 0 rgba(0, 255, 0, 0.75); }
            100% { text-shadow: -0.025em 0 0 rgba(255, 0, 60, 0.75), -0.025em -0.025em 0 rgba(0, 240, 255, 0.75), -0.025em -0.05em 0 rgba(0, 255, 0, 0.75); }
        }

        @keyframes glitch-anim {
            0% { clip: rect(30px, 9999px, 10px, 0); }
            20% { clip: rect(80px, 9999px, 90px, 0); }
            40% { clip: rect(10px, 9999px, 50px, 0); }
            60% { clip: rect(60px, 9999px, 20px, 0); }
            80% { clip: rect(40px, 9999px, 70px, 0); }
            100% { clip: rect(90px, 9999px, 30px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(60px, 9999px, 20px, 0); }
            20% { clip: rect(10px, 9999px, 50px, 0); }
            40% { clip: rect(90px, 9999px, 30px, 0); }
            60% { clip: rect(30px, 9999px, 10px, 0); }
            80% { clip: rect(80px, 9999px, 90px, 0); }
            100% { clip: rect(40px, 9999px, 70px, 0); }
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 0, 60, 0.1);
            border-left: 4px solid var(--accent-red);
            font-size: 0.9rem;
            color: var(--accent-red);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .blink {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        h2 {
            font-size: 1.3rem;
            color: var(--accent-cyan);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            position: relative;
            display: inline-block;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        p {
            font-size: 0.95rem;
            color: var(--text-gray);
            margin-bottom: 2rem;
            line-height: 1.8;
            text-align: left;
            border-left: 2px solid #333;
            padding-left: 1rem;
        }

        .button {
            display: inline-block;
            padding: 1rem 2rem;
            background: transparent;
            color: var(--accent-red);
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            position: relative;
            border: 2px solid var(--accent-red);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: all 0.3s;
            overflow: hidden;
        }

        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--accent-red);
            transition: left 0.3s;
            z-index: -1;
        }

        .button:hover {
            color: #000;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.5);
        }

        .button:hover::before {
            left: 0;
        }

        .hex-decoration {
            position: fixed;
            width: 200px;
            height: 200px;
            border: 2px solid rgba(255, 0, 60, 0.2);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            pointer-events: none;
            z-index: 1;
        }

        .hex-1 { top: 10%; left: 5%; animation: rotate 20s linear infinite; }
        .hex-2 { bottom: 10%; right: 5%; animation: rotate 20s linear infinite reverse; width: 300px; height: 300px; border-color: rgba(0, 240, 255, 0.1); }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.05;
            z-index: 9;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        @media (max-width: 480px) {
            h1 { font-size: 4rem; }
            h2 { font-size: 1.1rem; }
            .container { padding: 2rem; }
            .fox-image { width: 120px; }
            .fox-container::before,
            .fox-container::after {
                background-size: 120px auto;
            }
        }
    </style>
</head>
<body>
    <div class="noise"></div>
    <div class="grid"></div>
    <div class="hex-decoration hex-1"></div>
    <div class="hex-decoration hex-2"></div>
    
    <div class="container">
        <div class="status-bar">
            <span>ERROR CODE: 404</span>
            <span class="blink">_</span>
        </div>
        
        <!-- 故障风格的狐狸 -->
        <div class="fox-container">
            <img src="https://valedecem.top/images/fox.png" alt="迷失的狐狸" class="fox-image">
        </div>
        
        <div class="glitch-wrapper">
            <h1 data-text="404">404</h1>
        </div>
        
        <h2>Signal Lost</h2>
        
        <p>
            // 系统诊断完成<br>
            // 目标资源未找到<br>
            // 连接已中断<br>
            // 建议：返回安全区域
        </p>
        
        <a href="https://valedecem.top/home.html" class="button">[ 返回首页 ]</a>
    </div>

    <script>
        // 随机故障效果
        setInterval(() => {
            const h1 = document.querySelector('h1');
            if (Math.random() > 0.95) {
                h1.style.transform = `translate(${Math.random() * 4 - 2}px, ${Math.random() * 4 - 2}px)`;
                setTimeout(() => {
                    h1.style.transform = 'translate(0, 0)';
                }, 50);
            }
        }, 100);

        // 鼠标跟随视差效果
        document.addEventListener('mousemove', (e) => {
            const hex1 = document.querySelector('.hex-1');
            const hex2 = document.querySelector('.hex-2');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            hex1.style.transform = `rotate(${20 * x}deg) translate(${x * 20}px, ${y * 20}px)`;
            hex2.style.transform = `rotate(${-20 * y}deg) translate(${-x * 30}px, ${-y * 30}px)`;
        });

        // 狐狸悬停时的强烈故障
        const foxContainer = document.querySelector('.fox-container');
        foxContainer.addEventListener('mouseenter', () => {
            foxContainer.style.filter = 'grayscale(0%) contrast(150%) brightness(1.1)';
            document.querySelector('.fox-image').style.animationDuration = '0.2s';
        });
        
        foxContainer.addEventListener('mouseleave', () => {
            foxContainer.style.filter = 'grayscale(100%) contrast(120%) brightness(0.9)';
            document.querySelector('.fox-image').style.animationDuration = '4s';
        });
    </script>
</body>
</html>
